name: Label Self-Promotion

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  issues: write
  pull-requests: read

jobs:
  label-disclosed-affiliation:
    if: contains(github.event.pull_request.body, '- [x] I am affiliated with this listing') || contains(github.event.pull_request.body, '- [X] I am affiliated with this listing')
    runs-on: ubuntu-latest
    steps:
      - name: Add self-promotion label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['self-promo'],
            });
